name: Build and release Windows app

on:
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "beyondpack_entry.py"
      - "src/**"
      - "scripts/build-windows.ps1"
      - "docs/RELEASE_*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-windows.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "beyondpack_entry.py"
      - "src/**"
      - "scripts/build-windows.ps1"
      - "docs/RELEASE_*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beyondpack-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: WINDOWS-RELEASE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Read and verify version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable app
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Build single-file executable
        shell: pwsh
        run: .\scripts\build-windows.ps1 -OneFile

      - name: GUI startup self-test
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\onefile\BeyondPack.exe" `
            -ArgumentList "--self-test" `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $logPath = Join-Path $env:LOCALAPPDATA "BeyondPack\logs\startup.log"
            if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath | Write-Host
            }
            throw "Executable GUI startup self-test timed out after 30 seconds."
          }
          if ($process.ExitCode -ne 0) {
            $logPath = Join-Path $env:LOCALAPPDATA "BeyondPack\logs\startup.log"
            if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath | Write-Host
            }
            throw "Executable GUI startup self-test failed. Exit=$($process.ExitCode)"
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "release"
          $packageDir = Join-Path $releaseDir "portable-package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item ".\dist\portable\BeyondPack" -Destination $packageDir -Recurse
          Copy-Item ".\config.example.json" -Destination $packageDir
          Copy-Item ".\docs\OPERATOR_GUIDE.md" -Destination $packageDir
          Copy-Item ".\docs\ADMIN_GUIDE.md" -Destination $packageDir
          Copy-Item ".\docs\SHAREPOINT_SETUP.md" -Destination $packageDir

          $portableZip = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64-portable.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $portableZip -CompressionLevel Optimal

          $singleExe = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64.exe"
          Copy-Item ".\dist\onefile\BeyondPack.exe" -Destination $singleExe

          $checksumPath = Join-Path $releaseDir "SHA256SUMS.txt"
          @($singleExe, $portableZip) | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64
          path: |
            release/BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64.exe
            release/BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64-portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub pre-release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = ".\docs\RELEASE_$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes not found: $notesFile"
          }
          $assets = @(
            ".\release\BeyondPack-$env:RELEASE_VERSION-Windows-x64.exe",
            ".\release\BeyondPack-$env:RELEASE_VERSION-Windows-x64-portable.zip",
            ".\release\SHA256SUMS.txt"
          )
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --target $env:GITHUB_SHA `
              --title "BeyondPack $env:RELEASE_VERSION" `
              --notes-file $notesFile `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
          }
