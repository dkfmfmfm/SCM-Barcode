name: Build and release Windows app

on:
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "beyondpack_entry.py"
      - "src/**"
      - "scripts/build-windows.ps1"
      - "scripts/create-icon.py"
      - "installer/**"
      - "templates/**"
      - "docs/RELEASE_*.md"
      - "docs/USER_MANUAL.md"
      - "docs/FIELD_CHECKLIST.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-windows.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "beyondpack_entry.py"
      - "src/**"
      - "scripts/build-windows.ps1"
      - "scripts/create-icon.py"
      - "installer/**"
      - "templates/**"
      - "docs/RELEASE_*.md"
      - "docs/USER_MANUAL.md"
      - "docs/FIELD_CHECKLIST.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beyondpack-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: WINDOWS-RELEASE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Read and verify version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows database regression tests
        shell: pwsh
        run: |
          python -m pip install "openpyxl>=3.1,<4"
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v

      - name: Build portable app
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Build single-file executable
        shell: pwsh
        run: .\scripts\build-windows.ps1 -OneFile

      - name: GUI startup self-test
        shell: pwsh
        run: |
          # onefile은 압축 해제부터 수 초가 걸리고, 자체검사가 라벨 인쇄와
          # 상품 마스터 백업·복구까지 돌면서 Qt와 openpyxl 모듈 트리를 모두
          # 차갑게 읽어 들인다. 이 예산은 실제 소요가 아니라 멈춤을 잡기 위한
          # 상한이다. 단계별 소요는 아래 startup.log로 확인한다.
          $timeoutSeconds = 120
          $process = Start-Process `
            -FilePath ".\dist\onefile\BeyondPack.exe" `
            -ArgumentList "--self-test" `
            -PassThru
          $timedOut = -not $process.WaitForExit($timeoutSeconds * 1000)
          if ($timedOut) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          $logPath = Join-Path $env:LOCALAPPDATA "BeyondPack\logs\startup.log"
          if (Test-Path -LiteralPath $logPath) {
            Write-Host "--- startup.log ---"
            Get-Content -LiteralPath $logPath | Write-Host
            Write-Host "--- end startup.log ---"
          }
          if ($timedOut) {
            throw "Executable GUI startup self-test timed out after $timeoutSeconds seconds. The last SELF-TEST line above names the stage that hung."
          }
          if ($process.ExitCode -ne 0) {
            throw "Executable GUI startup self-test failed. Exit=$($process.ExitCode)"
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "release"
          $packageDir = Join-Path $releaseDir "portable-package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item ".\dist\portable\BeyondPack" -Destination $packageDir -Recurse
          Copy-Item ".\config.example.json" -Destination $packageDir
          Copy-Item ".\docs\OPERATOR_GUIDE.md" -Destination $packageDir
          Copy-Item ".\docs\ADMIN_GUIDE.md" -Destination $packageDir
          Copy-Item ".\docs\GOOGLE_SHEETS_SETUP.md" -Destination $packageDir
          Copy-Item ".\docs\USER_MANUAL.md" -Destination $packageDir
          Copy-Item ".\docs\FIELD_CHECKLIST.md" -Destination $packageDir
          Copy-Item ".\templates\BeyondPack_Master_Template.csv" -Destination $packageDir

          $portableZip = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64-portable.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $portableZip -CompressionLevel Optimal

          $singleExe = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64.exe"
          Copy-Item ".\dist\onefile\BeyondPack.exe" -Destination $singleExe

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION" ".\installer\BeyondPack.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compile failed. Exit=$LASTEXITCODE"
          }

      - name: Verify installer and create checksums
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "release"
          $singleExe = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64.exe"
          $portableZip = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64-portable.zip"
          $setupExe = Join-Path $releaseDir "BeyondPack-$env:RELEASE_VERSION-Windows-x64-Setup.exe"
          if (-not (Test-Path -LiteralPath $setupExe -PathType Leaf)) {
            throw "Installer was not created: $setupExe"
          }
          $checksumPath = Join-Path $releaseDir "SHA256SUMS.txt"
          @($setupExe, $singleExe, $portableZip) | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64
          path: |
            release/BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64.exe
            release/BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64-Setup.exe
            release/BeyondPack-${{ env.RELEASE_VERSION }}-Windows-x64-portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub pre-release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = ".\docs\RELEASE_$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes not found: $notesFile"
          }
          $assets = @(
            ".\release\BeyondPack-$env:RELEASE_VERSION-Windows-x64-Setup.exe",
            ".\release\BeyondPack-$env:RELEASE_VERSION-Windows-x64.exe",
            ".\release\BeyondPack-$env:RELEASE_VERSION-Windows-x64-portable.zip",
            ".\release\SHA256SUMS.txt"
          )
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" `
              -f sha="$env:GITHUB_SHA" `
              -F force=true
            if ($LASTEXITCODE -ne 0) {
              throw "Could not move $env:RELEASE_TAG to $env:GITHUB_SHA"
            }
            gh release edit $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              --title "BeyondPack $env:RELEASE_VERSION" `
              --notes-file $notesFile `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --target $env:GITHUB_SHA `
              --title "BeyondPack $env:RELEASE_VERSION" `
              --notes-file $notesFile `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
          }
