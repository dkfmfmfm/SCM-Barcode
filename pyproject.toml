[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beyondpack"
version = "2.2.8"
description = "Offline-first FNSKU packing workstation for BEYOND EARTH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "openpyxl>=3.1,<4",
]

[project.scripts]
beyondpack = "beyondpack.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyondpack = ["resources/*.json"]
